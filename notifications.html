<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ചിരട്ട ശാസ്താക്ഷേത്രം, തൊളിക്കുഴി - അറിയിപ്പുകൾ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Malayalam Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Malayalam', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 flex flex-col items-center min-h-screen">

    <!-- Close Button -->
    <button 
        onclick="window.close()" 
        class="fixed top-4 right-4 z-50 bg-white/80 backdrop-blur-sm text-gray-700 hover:text-orange-600 
               p-3 rounded-full shadow-lg hover:shadow-xl transition-all active:scale-95"
        title="Close"
        aria-label="Close page">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
        </svg>
    </button>

    <!-- Header -->
    <header class="w-full bg-gradient-to-r from-orange-500 to-red-600 text-white p-4 text-center shadow-md">
        <h1 class="text-2xl font-bold">ചിരട്ട ശാസ്താക്ഷേത്രം, തൊളിക്കുഴി</h1>
        <p class="text-lg">പ്രധാന അറിയിപ്പുകൾ</p>
    </header>
    
    <!-- Main -->
    <main class="w-full max-w-sm p-4 flex-grow">
        <div id="notifications" class="space-y-4">
            <p class="text-center text-gray-500 py-4">ലോഡ് ചെയ്യുന്നു...</p>
        </div>
    </main>
    
    <!-- Footer -->
    <footer class="w-full bg-gray-200 text-center p-2 text-sm text-gray-600">
        &copy; 2026 Temple Notifications
    </footer>
    
    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

       const firebaseConfig = {
  apiKey: "AIzaSyB3iBWleWNMCdQS9F0HR1wHBBtHkeMawhg",
  authDomain: "sjpss-f504b.firebaseapp.com",
  projectId: "sjpss-f504b",
  storageBucket: "sjpss-f504b.firebasestorage.app",
  messagingSenderId: "227402980311",
  appId: "1:227402980311:web:56b580456ab6b9c6758992",
  measurementId: "G-LZ4YP9YPN6"
};

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fetch and display notifications
        const notificationsDiv = document.getElementById("notifications");
        
        async function loadNotifications() {
            try {
                const q = query(
                    collection(db, "Tnotifications"),
                    where("status", "==", "active")
                );
                
                const querySnapshot = await getDocs(q);
                
                // Clear loading message
                notificationsDiv.innerHTML = '';
                
                if (querySnapshot.empty) {
                    notificationsDiv.innerHTML = `
                        <p class="text-center text-gray-500 py-4">
                            സജീവമായ അറിയിപ്പുകൾ ഒന്നുമില്ല.
                        </p>`;
                } else {
                    querySnapshot.forEach(doc => {
                        const data = doc.data();
                        const card = document.createElement("div");
                        card.className = "bg-white p-4 rounded-lg shadow border border-gray-200";
                        card.innerHTML = `
                            <p class="text-gray-800 leading-relaxed">
                                ${data.text}
                            </p>
                        `;
                        notificationsDiv.appendChild(card);
                    });
                }
            } catch (error) {
                console.error("Error fetching notifications:", error);
                notificationsDiv.innerHTML = `
                    <p class="text-center text-red-500 py-4">
                        അറിയിപ്പുകൾ ലോഡ് ചെയ്യുന്നതിൽ പിശക്: ${error.message}
                    </p>`;
            }
        }

        // Load notifications when page loads
        loadNotifications();
    </script>
</body>
</html>
