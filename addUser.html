<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>രജിസ്ട്രേഷൻ - ക്ഷേത്രം</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-amber-50 to-orange-50 min-h-screen font-sans">

    <!-- Toast -->
    <div id="toast" class="fixed top-4 left-4 right-4 md:right-6 md:left-auto md:w-96 p-4 rounded-xl shadow-2xl -translate-y-24 opacity-0 transition-all duration-300 z-50">
        <p id="toast-message" class="font-medium"></p>
    </div>

    <div class="min-h-screen flex items-center justify-center px-4 py-8 sm:py-12">
        <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden">

            <!-- Header -->
            <div class="bg-orange-600 text-white py-6 px-6 text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-full mb-4 shadow-lg">
                    <svg class="w-8 h-8 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                </div>
                <h1 id="form-title" class="text-2xl sm:text-3xl font-bold">രജിസ്ട്രേഷൻ</h1>
                <p class="mt-2 text-orange-100">നിർബന്ധമായും അടയാളപ്പെടുത്തിയ വിവരങ്ങൾ നൽകുക</p>
            </div>

            <!-- Form -->
            <form id="registration-form" class="p-6 sm:p-8 space-y-5">
                <!-- Name -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">പേര് <span class="text-red-600">*</span></label>
                    <input id="name" type="text" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none text-base transition" placeholder="പൂർണ്ണ നാമം">
                </div>

                <!-- Address -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">മേൽവിലാസം <span class="text-red-600">*</span></label>
                    <textarea id="address" rows="3" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none resize-none text-base transition" placeholder="പൂർണ്ണ മേൽവിലാസം"></textarea>
                </div>

                <!-- Age -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">വയസ്സ് <span class="text-red-600">*</span></label>
                    <input id="age" type="number" required min="1" max="120" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none text-base transition" placeholder="വയസ്സ്">
                </div>

                <!-- Star (Nakshatram) -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">നക്ഷത്രം <span class="text-red-600">*</span></label>
                    <select id="star" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none bg-white text-base transition">
                        <option value="">തിരഞ്ഞെടുക്കുക</option>
                        <option>അശ്വതി</option>
                        <option>ഭരണി</option>
                        <option>കാർത്തിക</option>
                        <option>രോഹിണി</option>
                        <option>മകയിരം</option>
                        <option>തിരുവാതിര</option>
                        <option>പുണർതം</option>
                        <option>പൂയം</option>
                        <option>ആയില്യം</option>
                        <option>മകം</option>
                        <option>പൂരം</option>
                        <option>ഉത്രം</option>
                        <option>അത്തം</option>
                        <option>ചിത്തിര</option>
                        <option>ചോതി</option>
                        <option>വിശാഖം</option>
                        <option>അനിഴം</option>
                        <option>കേട്ട</option>
                        <option>മൂലം</option>
                        <option>പൂരാടം</option>
                        <option>ഉത്രാടം</option>
                        <option>തിരുവോണം</option>
                        <option>അവിട്ടം</option>
                        <option>ചതയം</option>
                        <option>പൂരട്ടാതി</option>
                        <option>ഉത്രട്ടാതി</option>
                        <option>രേവതി</option>
                    </select>
                </div>

                <!-- Phone -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1.5">ഫോൺ നമ്പർ <span class="text-red-600">*</span></label>
                    <input id="phone" type="tel" required maxlength="10" pattern="[0-9]{10}" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none text-base transition" placeholder="10 അക്ക നമ്പർ">
                </div>

                <!-- Submit -->
                <button id="submit-btn" type="submit" data-mode="create"
                        class="w-full bg-orange-600 hover:bg-orange-700 active:bg-orange-800 text-white py-3.5 rounded-lg font-bold text-lg transition transform active:scale-[0.98] flex items-center justify-center gap-3 shadow-md">
                    <span id="btn-text">രജിസ്റ്റർ ചെയ്യുക</span>
                    <div id="btn-spinner" class="hidden animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div>
                </button>
            </form>

            <p class="text-center text-sm text-gray-500 py-5 px-6 border-t">
                🔒 നിങ്ങളുടെ വിവരങ്ങൾ സുരക്ഷിതമായി സൂക്ഷിക്കുന്നു
            </p>
        </div>
    </div>

    <!-- Devotee Registration Modal -->
    <div id="devoteePopup" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl p-6 w-96 text-center">
            <h2 class="text-base font-semibold text-gray-800 mb-4">
                തൊളിക്കുഴി ചിരട്ട ശാസ്താ ക്ഷേത്രത്തിലെ ഒരു ഭക്തനായി സൗജന്യമായി രജിസ്ടര്‍ ചെയ്യുവാന്‍ താല്പര്യം ഉണ്ടോ ?
            </h2>
            <div class="flex justify-center gap-4 mt-6">
                <button id="yes-btn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm">
                    	ഉണ്ട് 
                </button>
                <button id="no-btn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm">
                    ഇല്ല 
                </button>
            </div>
            <button id="close-popup-btn" class="mt-4 text-sm text-white hover:text-gray-100">
                Close
            </button>
        </div>
    </div>

    <!-- Firebase + App Logic (regular script, not module) -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, doc, setDoc, getDocs, query, where, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyB3iBWleWNMCdQS9F0HR1wHBBtHkeMawhg",
            authDomain: "sjpss-f504b.firebaseapp.com",
            projectId: "sjpss-f504b",
            storageBucket: "sjpss-f504b.firebasestorage.app",
            messagingSenderId: "227402980311",
            appId: "1:227402980311:web:56b580456ab6b9c6758992",
            measurementId: "G-LZ4YP9YPN6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- Toast ---
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = message;
            toast.className = `fixed top-4 left-4 right-4 md:right-6 md:left-auto md:w-96 p-4 rounded-xl shadow-2xl transform transition-all duration-300 z-50 text-white font-medium ${
                type === 'success' ? 'bg-green-600' : 'bg-red-600'
            }`;
            toast.classList.remove('-translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-24', 'opacity-0');
            }, 3200);
        }

        // --- Load existing user data ---
        async function loadUserData() {
            const savedPhone = localStorage.getItem('Phone');
            if (!savedPhone) return;

            try {
                const q = query(collection(db, "Tusers"), where("phone", "==", savedPhone));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const userDoc = querySnapshot.docs[0];
                    const data = userDoc.data();
                    const docId = userDoc.id;

                    document.getElementById('name').value = data.name || '';
                    document.getElementById('address').value = data.address || '';
                    document.getElementById('age').value = data.age || '';
                    document.getElementById('star').value = data.star || '';
                    document.getElementById('phone').value = data.phone || '';

                    const submitBtn = document.getElementById('submit-btn');
                    submitBtn.dataset.mode = 'update';
                    submitBtn.dataset.docid = docId;
                    document.getElementById('btn-text').textContent = 'പരിഷ്കരിക്കുക';
                    document.getElementById('form-title').textContent = 'വിവരങ്ങൾ പരിഷ്കരിക്കുക';

                    showToast('നിലവിലുള്ള വിവരങ്ങൾ ലോഡ് ചെയ്തു', 'success');
                }
            } catch (err) {
                console.error("Error loading user:", err);
            }
        }

        // --- Handle form submit ---
        async function handleSubmit(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            // Capture mode BEFORE any async changes
            const mode = submitBtn.dataset.mode || 'create';

            submitBtn.disabled = true;
            btnText.textContent = 'സമർപ്പിക്കുന്നു...';
            btnSpinner.classList.remove('hidden');

            try {
                const formData = {
                    name: document.getElementById('name').value.trim(),
                    address: document.getElementById('address').value.trim(),
                    age: parseInt(document.getElementById('age').value) || 0,
                    star: document.getElementById('star').value,
                    phone: document.getElementById('phone').value.trim()
                };

                const phone = formData.phone;
                if (!phone || phone.length !== 10) {
                    throw new Error("Invalid phone number");
                }

                if (mode === 'update') {
                    const docId = submitBtn.dataset.docid;
                    const userRef = doc(db, "Tusers", docId);
                    await updateDoc(userRef, formData);
                    showToast('വിവരങ്ങൾ വിജയകരമായി പരിഷ്കരിച്ചു!', 'success');
                } else {
                    await setDoc(doc(db, "Tusers", phone), formData);
                    showToast('രജിസ്ട്രേഷൻ വിജയകരമായി പൂർത്തിയാക്കി!', 'success');

                    // Switch to update mode after successful registration
                    submitBtn.dataset.mode = 'update';
                    submitBtn.dataset.docid = phone;
                    document.getElementById('form-title').textContent = 'വിവരങ്ങൾ പരിഷ്കരിക്കുക';
                }

                localStorage.setItem('Phone', phone);

            } catch (error) {
                console.error("Error:", error);
                showToast('പിശക് സംഭവിച്ചു. വീണ്ടും ശ്രമിക്കുക.', 'error');
            } finally {
                submitBtn.disabled = false;
                // Read mode AFTER possible update above
                btnText.textContent = submitBtn.dataset.mode === 'update' ? 'പരിഷ്കരിക്കുക' : 'രജിസ്റ്റർ ചെയ്യുക';
                btnSpinner.classList.add('hidden');
            }
        }

        // --- Popup controls (defined here, attached via addEventListener) ---
        function closePopup() {
            document.getElementById('devoteePopup').classList.add('hidden');
        }

        function continueRegister() {
            closePopup();
        }

        function goBack() {
             window.close();
        }

        // --- DOMContentLoaded: single entry point ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('registration-form').addEventListener('submit', handleSubmit);
            document.getElementById('yes-btn').addEventListener('click', continueRegister);
            document.getElementById('no-btn').addEventListener('click', goBack);
            document.getElementById('close-popup-btn').addEventListener('click', closePopup);

            // Show popup on load
	const phone = localStorage.getItem("Phone");
	if (!phone) {
        	document.getElementById("devoteePopup").classList.remove("hidden");
    	}
          //  document.getElementById('devoteePopup').classList.remove('hidden');

            // Load existing user
            loadUserData();
        });
    </script>
</body>
</html>
