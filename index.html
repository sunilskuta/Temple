<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Expired</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #1f2937, #111827);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    .container {
      max-width: 500px;
      padding: 20px;
      animation: fadeIn 1.2s ease-in-out;
    }

    img {
      width: 220px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #f87171;
    }

    p {
      font-size: 1rem;
      color: #d1d5db;
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 20px;
      background: #f87171;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ef4444;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- GIF -->
    <img src="https://media.giphy.com/media/3o7btPCcdNniyf0ArS/giphy.gif" alt="Expired">

    <h1>Page Expired</h1>
    <p>This page is no longer available.<br>Please contact the developer.</p>

    <button class="btn" onclick="location.reload()">Reload</button>

    <footer>
      Error Code: 410 | Access Denied
    </footer>

  </div>

  <!-- Background Audio -->
  <audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>

</body>
</html>
