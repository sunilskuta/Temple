<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temple Transaction Journal</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
<div class="max-w-6xl mx-auto bg-white shadow-2xl border border-gray-400">
  <!-- Header -->
  <div class="text-center border-b-4 border-black py-6">
    <h1 class="text-2xl font-bold tracking-widest uppercase">
      TRANSACTION JOURNAL REGISTER
    </h1>
    <p class="text-sm mt-2">Maintained Under Temple Administrative Records</p>
    <p class="text-sm" id="journalDate"></p>
  </div>
  
  <!-- Journal Table -->
  <div class="p-6 overflow-x-auto">
    <table class="w-full border-collapse border border-black text-sm">
      <thead class="bg-gray-200">
        <tr>
          <th class="border border-black px-3 py-2">Sl. No</th>
          <th class="border border-black px-3 py-2">Journal ID</th>
          <th class="border border-black px-3 py-2">Date & Time</th>
          <th class="border border-black px-3 py-2">Devotee Name</th>
          <th class="border border-black px-3 py-2">Nakshatra</th>
          <th class="border border-black px-3 py-2">Offering</th>
          <th class="border border-black px-3 py-2 text-right">Amount (₹)</th>
          <th class="border border-black px-3 py-2">Mode</th>
          <th class="border border-black px-3 py-2">Operator ID</th>
        </tr>
      </thead>
      <tbody id="journalBody">
        <!-- Dynamic rows here -->
      </tbody>
    </table>
  </div>
  
  <!-- Summary Section -->
  <div class="border-t-2 border-black p-6 bg-gray-50">
    <div class="grid grid-cols-3 gap-4 text-sm font-semibold">
      <div class="text-center">
        <p class="text-gray-600">Total Cash</p>
        <p class="text-xl text-green-700" id="totalCash">₹0</p>
      </div>
      <div class="text-center">
        <p class="text-gray-600">Total UPI</p>
        <p class="text-xl text-blue-700" id="totalUPI">₹0</p>
      </div>
      <div class="text-center">
        <p class="text-gray-600">Grand Total</p>
        <p class="text-xl text-purple-700" id="grandTotal">₹0</p>
      </div>
    </div>
  </div>
  
  <!-- Footer -->
  <div class="border-t-2 border-black p-6 text-sm">
    <div class="flex justify-between">
      <div>
        <p><b>Verified By:</b> ____________________</p>
      </div>
      <div class="text-right">
        <p><b>Signature:</b> ____________________</p>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

 const firebaseConfig = {
      apiKey: "AIzaSyB3iBWleWNMCdQS9F0HR1wHBBtHkeMawhg",
      authDomain: "sjpss-f504b.firebaseapp.com",
      projectId: "sjpss-f504b",
      storageBucket: "sjpss-f504b.firebasestorage.app",
      messagingSenderId: "227402980311",
      appId: "1:227402980311:web:56b580456ab6b9c6758992",
      measurementId: "G-LZ4YP9YPN6"
    };



  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Function to extract numeric part from journalId for sorting
  function getJournalNumber(journalId) {
    if (!journalId) return 0;
    // Extract numbers from journalId (e.g., "TJ001" -> 1, "TJ123" -> 123)
    const match = journalId.match(/\d+/);
    return match ? parseInt(match[0]) : 0;
  }

  // Load journals
  async function loadJournals() {
    try {
      const querySnapshot = await getDocs(collection(db, "Tjournals"));
      const tbody = document.getElementById("journalBody");
      tbody.innerHTML = ''; // Clear existing content
      
      // Collect all documents into an array
      const journals = [];
      querySnapshot.forEach(doc => {
        journals.push(doc.data());
      });
      
      // Sort by journalId in ascending order
      journals.sort((a, b) => {
        const idA = a.journalId || '';
        const idB = b.journalId || '';
        
        // Try numeric comparison first
        const numA = getJournalNumber(idA);
        const numB = getJournalNumber(idB);
        
        if (numA !== numB) {
          return numA - numB;
        }
        
        // Fallback to string comparison
        return idA.localeCompare(idB);
      });
      
      let sl = 1;
      let totalCash = 0;
      let totalUPI = 0;
      
      // Render sorted journals
      journals.forEach(data => {
        const amount = parseFloat(data.cost) || 0;
        const mode = (data.mode || 'Cash').toUpperCase();
        
        // Calculate totals
        if (mode === 'UPI') {
          totalUPI += amount;
        } else {
          totalCash += amount;
        }
        
        // Determine badge style based on payment mode
        const modeBadge = mode === 'UPI' 
          ? '<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-semibold">UPI</span>'
          : '<span class="bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-semibold">CASH</span>';
        
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="border border-black px-2 py-1 text-center">${sl++}</td>
          <td class="border border-black px-2 py-1">${data.journalId || 'N/A'}</td>
          <td class="border border-black px-2 py-1">
            ${data.dateTime ? new Date(data.dateTime.seconds * 1000).toLocaleString() : 'N/A'}
          </td>
          <td class="border border-black px-2 py-1">${data.name || 'N/A'}</td>
          <td class="border border-black px-2 py-1">${data.nakshatra || 'N/A'}</td>
          <td class="border border-black px-2 py-1">${data.offering || 'N/A'}</td>
          <td class="border border-black px-2 py-1 text-right font-semibold">${amount.toFixed(2)}</td>
          <td class="border border-black px-2 py-1 text-center">${modeBadge}</td>
          <td class="border border-black px-2 py-1">${data.operatorId || 'N/A'}</td>
        `;
        tbody.appendChild(row);
      });
      
      // Update summary totals
      document.getElementById('totalCash').textContent = `₹${totalCash.toFixed(2)}`;
      document.getElementById('totalUPI').textContent = `₹${totalUPI.toFixed(2)}`;
      document.getElementById('grandTotal').textContent = `₹${(totalCash + totalUPI).toFixed(2)}`;
      
      if (journals.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="border border-black px-2 py-4 text-center text-gray-500">No records found</td></tr>';
      }
    } catch (error) {
      console.error("Error loading journals:", error);
      document.getElementById("journalBody").innerHTML = 
        '<tr><td colspan="9" class="border border-black px-2 py-4 text-center text-red-500">Error loading data. Check console.</td></tr>';
    }
  }

  // Show today's date in header
  document.getElementById("journalDate").textContent =
    "Report Generated On: " + new Date().toLocaleString();

  // Load journals on page load
  loadJournals();
</script>
</body>
</html>
