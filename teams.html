    tailwind.config = {

  <style>
    * { box-sizing: border-box; }
    body { background: #080810; font-family: 'DM Sans', sans-serif; }

    .grain::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 100; opacity: 0.4;
    }

    .video-wrapper {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .video-wrapper::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: 12px;
      box-shadow: inset 0 0 0 1px rgba(232,255,71,0.08);
      pointer-events: none;
    }

    video, iframe {
      width: 100%; height: 100%; display: block;
      border-radius: 12px;
    }

    .music-btn {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    .music-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(232,255,71,0.06), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .music-btn:hover::before { opacity: 1; }
    .music-btn:hover { transform: translateY(-2px); }
    .music-btn:active { transform: scale(0.97); }
    .music-btn.playing { border-color: rgba(232,255,71,0.5) !important; }
    .music-btn.playing .track-num { color: #e8ff47; }

    .eq-bar {
      width: 3px; border-radius: 2px;
      background: #e8ff47;
      animation: eq 0.8s ease-in-out infinite alternate;
    }
    .eq-bar:nth-child(2) { animation-delay: 0.15s; }
    .eq-bar:nth-child(3) { animation-delay: 0.3s; }
    .eq-bar:nth-child(4) { animation-delay: 0.1s; }

    .progress-bar {
      height: 2px;
      background: rgba(232,255,71,0.2);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-fill {
      height: 100%;
      background: #e8ff47;
      border-radius: 2px;
      width: 0%;
      transition: width 0.5s linear;
    }

    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,255,71,0.3), transparent);
      animation: scan 4s linear infinite;
      pointer-events: none;
    }
    @keyframes scan {
      0% { top: 0; opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .header-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,255,71,0.4), transparent);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.6s ease forwards; }
    .delay-1 { animation-delay: 0.1s; opacity: 0; }
    .delay-2 { animation-delay: 0.2s; opacity: 0; }
    .delay-3 { animation-delay: 0.35s; opacity: 0; }

  <!-- Hidden audio player -->
  <audio id="audioPlayer" preload="none"></audio>

  <script>
    const audio = document.getElementById('audioPlayer');
    const tracks = document.querySelectorAll('.music-btn');
    let currentBtn = null;
    let progressInterval = null;

    function resetBtn(btn) {
      btn.classList.remove('playing');
      const eq = btn.querySelector('.eq-anim');
      const play = btn.querySelector('.play-icon');
      const pause = btn.querySelector('.pause-icon');
      eq.classList.add('hidden');
      eq.classList.remove('flex');
      play.classList.remove('hidden');
      pause.classList.add('hidden');
      pause.classList.remove('flex');
      btn.querySelector('.progress-fill').style.width = '0%';
    }

    function activateBtn(btn) {
      btn.classList.add('playing');
      const eq = btn.querySelector('.eq-anim');
      const play = btn.querySelector('.play-icon');
      const pause = btn.querySelector('.pause-icon');
      eq.classList.remove('hidden');
      eq.classList.add('flex');
      play.classList.add('hidden');
      pause.classList.remove('hidden');
      pause.classList.add('flex');
    }

    function playTrack(btn, index) {
      const src = btn.dataset.src;

      // Same track — toggle pause/play
      if (currentBtn === btn) {
        if (!audio.paused) {
          audio.pause();
          const eq = btn.querySelector('.eq-anim');
          eq.style.animationPlayState = 'paused';
        } else {
          audio.play();
          const eq = btn.querySelector('.eq-anim');
          eq.style.animationPlayState = 'running';
        }
        return;
      }

      // Different track
      if (currentBtn) resetBtn(currentBtn);
      clearInterval(progressInterval);

      audio.src = src;
      audio.play().catch(e => console.log('Autoplay blocked:', e));
      currentBtn = btn;
      activateBtn(btn);

      progressInterval = setInterval(() => {
        if (audio.duration && currentBtn) {
          const pct = (audio.currentTime / audio.duration) * 100;
          currentBtn.querySelector('.progress-fill').style.width = pct + '%';
        }
      }, 500);
    }

    audio.addEventListener('ended', () => {
      if (currentBtn) resetBtn(currentBtn);
      currentBtn = null;
      clearInterval(progressInterval);
    });


let player;

function playYT(btn){

  const videoId = btn.dataset.yt;

  const popup = document.getElementById("ytPopup");
  const frame = document.getElementById("ytFrame");

  frame.src = "https://www.youtube.com/embed/" + videoId + "?autoplay=1&rel=0";

  popup.classList.remove("hidden");
  popup.classList.add("flex");

}

function closeYT(){

  const popup = document.getElementById("ytPopup");
  const frame = document.getElementById("ytFrame");

  frame.src = "";
  popup.classList.add("hidden");
  popup.classList.remove("flex");

}
